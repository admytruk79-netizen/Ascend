<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Invisible Strike — Energetic Defense</title>
<meta name="description" content="A personal shield companion app: recognize and amortize energetic attacks in real time.">
<meta name="theme-color" content="#0b1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Invis. Strike">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app" class="app">

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 L20 5 V11.5 C20 16.2 16.9 20 12 22 C7.1 20 4 16.2 4 11.5 V5 Z" fill="currentColor"/>
      </svg>
      <span>Invisible Strike</span>
    </div>
    <button id="streakChip" class="streak-chip" aria-label="Practice streak">🔥 <span id="streakCount">0</span></button>
  </header>

  <!-- ===== Main view (swapped by router) ===== -->
  <main id="view" class="view" tabindex="-1"></main>

  <!-- ===== Floating one-tap Quick Shield button (always available) ===== -->
  <button id="quickShieldFab" class="fab" aria-label="Quick Shield — instant reset">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L20 5 V11.5 C20 16.2 16.9 20 12 22 C7.1 20 4 16.2 4 11.5 V5 Z" fill="currentColor"/></svg>
    <span>Shield</span>
  </button>

  <!-- ===== Bottom navigation ===== -->
  <nav class="bottomnav" aria-label="Primary">
    <button class="navitem" data-route="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
      <span>Home</span>
    </button>
    <button class="navitem" data-route="practice" aria-label="Daily Practice">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Practice</span>
    </button>
    <button class="navitem" data-route="checkin" aria-label="Situational Check-In">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4Z"/></svg>
      <span>Check-In</span>
    </button>
    <button class="navitem" data-route="drills" aria-label="Drill Deck">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="12" height="16" rx="2"/><rect x="9" y="3" width="12" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Drills</span>
    </button>
    <button class="navitem" data-route="more" aria-label="More">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>More</span>
    </button>
  </nav>
</div>

<!-- ===== Modal host for Quick Shield & drill overlays ===== -->
<div id="modalHost" class="modal-host" aria-hidden="true"></div>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
