name: Android build

on:
  push:
    branches: [ "claude/ascend-keys-worker-vnxzw1" ]
    paths:
      - "mobile-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ascend-keys-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Read app version
        id: version
        working-directory: mobile-app/android/app
        run: |
          echo "code=$(grep -oP 'versionCode \K[0-9]+' build.gradle)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oP 'versionName "\K[^"]+' build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-v${{ steps.version.outputs.code }}-run${{ github.run_number }}
          name: "Debug build ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})"
          prerelease: true
          files: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

  # Signed release bundle (.aab) for Play Console. Manual trigger only — this
  # needs a real upload keystore, so it doesn't make sense to run on every
  # push. Requires four repo secrets to be set first (Settings -> Secrets and
  # variables -> Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. See mobile-app/README.md for how
  # to generate the keystore and encode it. Run via the Actions tab -> this
  # workflow -> "Run workflow".
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Write signing config from secrets
        working-directory: mobile-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing one or more signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). See mobile-app/README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify signing secrets decode correctly (no secret values printed)
        working-directory: mobile-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "decoded keystore size (bytes): $(wc -c < release.keystore)"
          echo "decoded keystore sha256: $(sha256sum release.keystore | cut -d' ' -f1)"
          echo "ANDROID_KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "ANDROID_KEY_PASSWORD length: ${#KEY_PASSWORD}"
          echo "ANDROID_KEY_ALIAS value length: ${#KEY_ALIAS}"
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            && echo "KEYTOOL CHECK: password and alias are valid for this keystore" \
            || echo "KEYTOOL CHECK: FAILED - password/alias do not match this keystore"

      - name: Build signed release bundle
        working-directory: mobile-app/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Clean up signing material
        if: always()
        working-directory: mobile-app/android
        run: rm -f release.keystore keystore.properties

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: ascend-keys-release-aab
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
