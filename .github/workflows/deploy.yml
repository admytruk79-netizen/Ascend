name: Deploy Qremyn / Qremyn Station Worker

# Manual-only. Cloudflare's own deploy integration already deploys this
# repo automatically on every push to main — see the "roviq-site" Worker
# in the dashboard. This workflow is a CLI-based alternative for
# anyone who'd rather deploy via GitHub Actions instead; it needs
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets before it
# will succeed (README has details). It no longer runs on push so it can't
# fail silently in the background if those secrets are never set.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.17"
          command: deploy
