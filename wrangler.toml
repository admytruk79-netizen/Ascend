name = "invisible-strike"
main = "worker.js"
compatibility_date = "2024-09-23"

# Static PWA assets (index.html, manifest.json, sw.js, css/, js/, icons/)
# served directly by the Workers runtime; worker.js only handles /api/* routes.
[assets]
directory = "./"
binding = "ASSETS"

# Uncomment once a KV namespace has been created (`wrangler kv namespace create ENTITLEMENTS`)
# to persist paid-tier unlock tokens server-side.
# [[kv_namespaces]]
# binding = "ENTITLEMENTS"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Stripe credentials are secrets, not vars — set them with:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
[vars]
# STRIPE_PRICE_ID = "price_REPLACE_ME"
