<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCEND Keys — Reading Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0A0F18; --bg2: #0E1420;
    --gold: #C4A84A; --gold-hover: #dcc078;
    --cream: #F3ECD9;
    --parchment: #F6F1E4; --ink: #241D0F;
    --supported: #5a7a3a; --resisted: #a3492f; --quality: #8a6d1f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg1); }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    min-height: 100vh;
    background:
      radial-gradient(ellipse 700px 400px at 50% 0%, rgba(196,168,74,.08), transparent 60%),
      linear-gradient(180deg, var(--bg2), var(--bg1));
    display: flex;
    justify-content: center;
  }
  a { color: var(--gold); text-decoration: none; }
  a:hover { color: var(--gold-hover); }
  button { font-family: inherit; }

  #app { width: 100%; max-width: 480px; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

  .header { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 10px; }
  .wordmark { font: 600 13px/1 'Cinzel', serif; letter-spacing: 3px; color: var(--gold); }
  .member-pill {
    font: 600 9px/1 'Inter', sans-serif; letter-spacing: 1.5px; color: var(--gold);
    border: 1px solid rgba(196,168,74,.4); padding: 5px 10px; border-radius: 10px;
  }

  @keyframes unfold {
    from { opacity: 0; transform: scaleY(0.94) translateY(8px); }
    to   { opacity: 1; transform: scaleY(1) translateY(0); }
  }
  .screen {
    flex: 1; display: flex; flex-direction: column;
    transform-origin: top center;
    animation: unfold .4s cubic-bezier(.4,0,.2,1);
  }

  /* ---- INTRO ---- */
  .intro { align-items: center; justify-content: center; gap: 22px; padding: 48px 32px; text-align: center; }
  .intro-mark { font: 600 15px/1 'Cinzel', serif; letter-spacing: 4px; color: var(--gold); }
  .intro-tagline { font: italic 500 20px/1.4 'Cormorant Garamond', serif; color: var(--cream); }
  .intro-body { font: 14px/1.65 'Inter', sans-serif; color: rgba(243,236,217,.6); max-width: 320px; }

  /* ---- HOME ---- */
  .home { padding: 8px 24px 40px; }
  .tagline { font: italic 400 15px/1.5 'Cormorant Garamond', serif; color: rgba(243,236,217,.6); margin-bottom: 28px; }
  .section-label {
    font: 600 10px/1 'Inter', sans-serif; letter-spacing: 2.5px; color: rgba(243,236,217,.4);
    text-transform: uppercase; margin-bottom: 14px;
  }
  .spread-list { display: flex; flex-direction: column; gap: 10px; }
  .spread-row {
    display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 12px;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .spread-dots { display: flex; gap: 3px; width: 52px; flex-wrap: wrap; }
  .spread-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  .spread-row-body { flex: 1; }
  .spread-row-title { font: 500 15px/1.2 'Cormorant Garamond', serif; color: var(--cream); }
  .spread-row-sub { font: 11px/1.4 'Inter', sans-serif; color: rgba(243,236,217,.45); margin-top: 3px; }
  .spread-tag { font: 600 9px/1 'Inter', sans-serif; letter-spacing: 1px; white-space: nowrap; }

  /* ---- DRAWING ---- */
  .drawing { align-items: center; justify-content: center; gap: 24px; padding: 40px 24px; text-align: center; }
  .card-back {
    width: 120px; height: 170px; border-radius: 12px; border: 1.5px solid rgba(196,168,74,.55);
    background: linear-gradient(160deg,#182234,#0D1420); box-shadow: 0 20px 50px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
  }
  .card-back-mono { font: 600 11px/1 'Cinzel', serif; letter-spacing: 2px; color: var(--gold); opacity: .7; }
  .drawing-title { font: 500 20px/1.2 'Cormorant Garamond', serif; margin-bottom: 6px; }
  .drawing-sub { font: 13px/1.5 'Inter', sans-serif; color: rgba(243,236,217,.5); max-width: 280px; }
  .btn-gold {
    padding: 14px 36px; border-radius: 24px; border: none; background: var(--gold); color: #12160D;
    font: 600 12px/1 'Inter', sans-serif; letter-spacing: 1.5px; cursor: pointer;
  }
  .btn-gold:disabled { opacity: .55; cursor: default; }
  .link-dim { font: 11px/1 'Inter', sans-serif; color: rgba(243,236,217,.4); margin-top: 4px; background: none; border: none; cursor: pointer; }

  /* ---- PAYWALL ---- */
  .paywall { align-items: center; justify-content: center; gap: 18px; padding: 40px 30px; text-align: center; }
  .paywall-glyph { font-size: 26px; opacity: .75; }
  .paywall-title { font: 500 20px/1.3 'Cormorant Garamond', serif; }
  .paywall-body { font: 13px/1.6 'Inter', sans-serif; color: rgba(243,236,217,.55); max-width: 300px; }
  .paywall-price { font: 600 26px/1 'Cormorant Garamond', serif; color: var(--gold); margin-top: 6px; }
  .paywall-price small { font: 12px 'Inter', sans-serif; color: rgba(243,236,217,.5); }
  .paywall-fineprint { font: 10px/1 'Inter', sans-serif; color: rgba(243,236,217,.3); letter-spacing: .5px; }

  /* ---- READING ---- */
  .reading { padding: 6px 24px 28px; }
  .thread-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .thread-row span { width: 8px; height: 8px; border-radius: 50%; }
  .reading-meta { text-align: center; margin-bottom: 16px; }
  .reading-position { font: 600 10px/1 'Inter', sans-serif; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; }
  .reading-num { font: 10px/1 'Inter', sans-serif; letter-spacing: 1.5px; color: rgba(243,236,217,.4); text-transform: uppercase; margin-bottom: 8px; }
  .reading-title { font: 500 24px/1.25 'Cormorant Garamond', serif; }
  .breathe-strip {
    display: flex; align-items: center; gap: 10px; justify-content: center; padding: 10px 16px;
    border: 1px solid rgba(196,168,74,.3); border-radius: 12px; background: rgba(196,168,74,.05); margin-bottom: 20px;
  }
  .breathe-label { font: 600 9px/1 'Inter', sans-serif; letter-spacing: 1.5px; color: var(--gold); white-space: nowrap; }
  .breathe-text { font: 12px/1.4 'Inter', sans-serif; color: rgba(243,236,217,.7); }
  .tab-switch { display: flex; gap: 6px; margin-bottom: 16px; background: rgba(255,255,255,.04); border-radius: 10px; padding: 4px; }
  .tab-btn {
    flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; cursor: pointer;
    font: 600 11px/1 'Inter', sans-serif; letter-spacing: 1px; background: transparent; border: none; color: rgba(243,236,217,.45);
  }
  .tab-btn.active { background: var(--cream); color: var(--ink); }
  .grounded-panel { background: var(--parchment); border-radius: 12px; padding: 22px 20px; color: var(--ink); }
  .grounded-quality { font: 600 10px/1 'Inter', sans-serif; letter-spacing: 1px; color: var(--quality); text-transform: uppercase; margin-bottom: 12px; }
  .grounded-where { font: 16px/1.55 'Cormorant Garamond', serif; margin-bottom: 16px; }
  .grounded-sublabel { font: 600 9px/1 'Inter', sans-serif; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
  .grounded-supported-label { color: var(--supported); }
  .grounded-resisted-label { color: var(--resisted); }
  .grounded-subtext { font: 13.5px/1.5 'Inter', sans-serif; margin-bottom: 14px; }
  .spirit-panel {
    border: 1px solid rgba(196,168,74,.3); border-radius: 12px; padding: 22px 20px;
    background: linear-gradient(160deg, rgba(196,168,74,.06), rgba(255,255,255,.01));
  }
  .spirit-phrase { font: italic 500 17px/1.5 'Cormorant Garamond', serif; color: var(--cream); margin-bottom: 16px; }
  .spirit-interp { font: 14px/1.6 'Cormorant Garamond', serif; color: rgba(243,236,217,.75); margin-bottom: 16px; }
  .spirit-med-label { font: 600 9px/1 'Inter', sans-serif; letter-spacing: 1.5px; color: var(--gold); opacity: .7; text-transform: uppercase; margin-bottom: 6px; }
  .spirit-med-text { font: italic 400 13.5px/1.55 'Cormorant Garamond', serif; color: rgba(243,236,217,.6); }
  .reading-nav { display: flex; gap: 10px; margin-top: 22px; }
  .btn-outline {
    flex: none; padding: 13px 20px; border-radius: 22px; border: 1px solid rgba(255,255,255,.15);
    background: transparent; color: var(--cream); font: 600 12px/1 'Inter', sans-serif; cursor: pointer;
  }
  .btn-next {
    flex: 1; padding: 13px 20px; border-radius: 22px; border: none; background: var(--gold); color: #12160D;
    font: 600 12px/1 'Inter', sans-serif; letter-spacing: 1px; cursor: pointer;
  }

  /* ---- SYNTHESIS ---- */
  .synthesis { justify-content: center; padding: 32px 26px 40px; }
  .synth-label-top {
    font: 600 10px/1 'Inter', sans-serif; letter-spacing: 2.5px; color: rgba(243,236,217,.4);
    text-transform: uppercase; margin-bottom: 20px; text-align: center;
  }
  .synth-thread { display: flex; align-items: center; gap: 0; margin-bottom: 24px; }
  .synth-thread span.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .synth-thread span.line { flex: 1; height: 1px; background: rgba(255,255,255,.15); }
  .synth-headline { font: 400 19px/1.55 'Cormorant Garamond', serif; color: var(--cream); margin-bottom: 16px; text-align: center; }
  .synth-sub { font: 13px/1.6 'Inter', sans-serif; color: rgba(243,236,217,.55); margin-bottom: 20px; text-align: center; }
  .synth-takeaway { border-left: 2px solid var(--gold); padding-left: 16px; font: 500 14px/1.6 'Inter', sans-serif; color: var(--cream); margin-bottom: 32px; }
  .btn-outline-gold {
    padding: 14px 20px; border-radius: 24px; border: 1px solid rgba(196,168,74,.5); background: transparent;
    color: var(--gold); font: 600 12px/1 'Inter', sans-serif; letter-spacing: 1.5px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="js-error-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:9999; background:#c0392b; color:#fff; padding:14px; font-family:monospace; font-size:13px; line-height:1.4; word-break:break-word;"></div>
<script>
  function showJsErrorBanner(text) {
    var el = document.getElementById('js-error-banner');
    el.style.display = 'block';
    el.textContent = text;
  }
  window.addEventListener('error', function (e) {
    showJsErrorBanner('JS ERROR: ' + e.message + ' (' + (e.filename || '?').split('/').pop() + ':' + e.lineno + ')');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    showJsErrorBanner('PROMISE ERROR: ' + reason);
  });
</script>

<div id="app">
  <div class="header">
    <div class="wordmark">ASCEND KEYS</div>
    <div class="member-pill" id="memberPill" style="display:none;">MEMBER</div>
  </div>
  <div id="screen"></div>
</div>

<script src="cards_data.js"></script>
<script src="billing.js"></script>
<script src="app.js"></script>
</body>
</html>
